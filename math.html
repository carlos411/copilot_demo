<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加法計算</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f5f5;
      }
      .card {
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 280px;
      }
      h1 { margin: 0 0 1.5rem; font-size: 1.4rem; }
      input {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        margin-bottom: 0.75rem;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        font-size: 1rem;
        background: #4a90e2;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { background: #357abd; }
      #result {
        margin-top: 1rem;
        font-size: 1.2rem;
        font-weight: bold;
        min-height: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>加法計算</h1>
      <input type="number" id="num1" placeholder="第一個數字">
      <input type="number" id="num2" placeholder="第二個數字">
      <button onclick="document.getElementById('result').textContent = add(parseFloat(document.getElementById('num1').value), parseFloat(document.getElementById('num2').value))">計算</button>
      <div id="result"></div>
    </div>
    <script src="js/math.js"></script>
  </body>
</html>
